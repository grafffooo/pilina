name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown${{ matrix.platform == 'macos-latest' && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install frontend dependencies and build web app
        run: |
          cd web
          npm install
          npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: 'Pilina v__VERSION__'
          releaseBody: |
            ### Pilina v__VERSION__ — Sheet goods, cut plans & workshop offcuts

            Download the standalone installer for your platform:
            - **macOS:** Download the `.dmg` package (Universal binary for Apple Silicon M1/M2/M3/M4 and Intel Macs).
            - **Windows:** Download the `.exe` setup installer (`-setup.exe`) or `.msi` package.
            - **Linux:** Download the `.AppImage` (standalone), `.deb`, or `.rpm` package.
            - **Android:** Download the `.apk` package for phone / tablet install.
            - **Docker / NAS:** Run `ghcr.io/grafffooo/pilina:latest` on Ugreen NAS, Synology, or local Docker server.

            You can also run Pilina in any modern browser as an offline Progressive Web App (PWA) at https://grafffooo.github.io/pilina/ with zero install.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
