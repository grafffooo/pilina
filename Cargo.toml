[workspace]
resolver = "3"
members = ["crates/pilina-core", "crates/pilina-wasm", "crates/pilina-cli", "desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pilina-core = { path = "crates/pilina-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Smaller WebAssembly output
[profile.release-wasm]
inherits = "release"
opt-level = "s"
